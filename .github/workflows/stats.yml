
name: Update profile statistics

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=FarmaanFJM&show_icons=true&hide_border=true&hide_title=true&hide_rank=true&include_all_commits=true&theme=github_dark
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=FarmaanFJM&theme=github-dark-blue&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Publish statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/streak.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile statistics"
            git push
          fi
